name: Deploy Supabase Edge Functions

# Auto-deploys edge functions whenever they change on main, so the deployed
# backend always matches the repo (no more manual `supabase functions deploy`).
# One-time setup: add a repo secret SUPABASE_ACCESS_TOKEN
# (Supabase Dashboard → Account → Access Tokens).

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: xebtjnvfkroiplyzftas
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all edge functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"
