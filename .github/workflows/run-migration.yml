name: Run one-off migration

on:
  workflow_dispatch: {}

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply UTM attribution migration
        run: |
          SQL=$(cat supabase_add_utm_attribution.sql)
          PAYLOAD=$(jq -n --arg q "$SQL" '{query:$q}')
          curl -s -X POST "https://api.supabase.com/v1/projects/xebtjnvfkroiplyzftas/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"