<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover" />
    <title>Resonance Kinesiology — Daniele Buatti</title>
    <meta name="description" content="FNH kinesiology and voice/piano coaching with Daniele Buatti in Melbourne. Book a session — no account needed." />

    <!-- Fonts arrive from Google; warm the connection before the CSS @import
         in globals.css asks for it. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA / iOS standalone. Two theme colours so the browser chrome matches
         the real canvas in each theme, not a warm stone tone. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1218" />
    <meta name="theme-color" content="#F8FAFC" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Resonance" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kinesiology-app.vercel.app/" />
    <meta property="og:title" content="Resonance Kinesiology — Daniele Buatti" />
    <meta property="og:description" content="FNH kinesiology and voice/piano coaching with Daniele Buatti in Melbourne. Book a session — no account needed." />
    <meta property="og:image" content="https://kinesiology-app.vercel.app/social-preview.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kinesiology-app.vercel.app/" />
    <meta property="twitter:title" content="Resonance Kinesiology — Daniele Buatti" />
    <meta property="twitter:description" content="FNH kinesiology and voice/piano coaching with Daniele Buatti in Melbourne. Book a session — no account needed." />
    <meta property="twitter:image" content="https://kinesiology-app.vercel.app/social-preview.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
