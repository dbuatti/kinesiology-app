<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antigravity Email</title>
    <style>
        /* RESET STYLES */
        body { margin: 0; padding: 0; min-width: 100%; width: 100% !important; height: 100% !important; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        table { border-spacing: 0; border-collapse: collapse; }
        img { border: 0; line-height: 100%; outline: none; text-decoration: none; }
        
        /* LAYOUT */
        .wrapper { width: 100%; table-layout: fixed; background-color: #f8fafc; padding-bottom: 40px; }
        .main { background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 600px; border-spacing: 0; color: #1e293b; border-radius: 24px; overflow: hidden; margin-top: 40px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        
        /* HEADER */
        .header { background-color: #4f46e5; padding: 40px; text-align: center; }
        .logo { color: #ffffff; font-size: 24px; font-weight: 900; letter-spacing: -0.05em; text-transform: uppercase; }
        .logo-icon { background-color: rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 12px; margin-right: 8px; }

        /* CONTENT */
        .content { padding: 40px; line-height: 1.6; font-size: 16px; }
        .content h1, .content h2, .content h3 { color: #0f172a; font-weight: 800; margin-top: 0; }
        .content p { margin-bottom: 20px; color: #475569; }
        .content a { color: #4f46e5; text-decoration: underline; font-weight: 600; }
        
        /* FOOTER */
        .footer { width: 100%; max-width: 600px; margin: 0 auto; padding: 40px 20px; text-align: center; color: #94a3b8; font-size: 12px; }
        .footer a { color: #6366f1; text-decoration: none; font-weight: bold; }
        .footer-divider { height: 1px; background-color: #e2e8f0; margin-bottom: 20px; }
        
        /* BUTTONS (For use in message_content) */
        .btn { background-color: #4f46e5; color: #ffffff !important; padding: 14px 28px; border-radius: 12px; text-decoration: none !important; display: inline-block; font-weight: bold; font-size: 14px; text-transform: uppercase; letter-spacing: 0.1em; }

        /* MOBILE OPTIMIZATION */
        @media screen and (max-width: 600px) {
            .main { margin-top: 0; border-radius: 0; }
            .content { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <center class="wrapper">
        <table class="main" role="presentation">
            <!-- Header -->
            <tr>
                <td class="header">
                    <div class="logo">
                        <span class="logo-icon">A</span> Antigravity
                    </div>
                    <div style="color: #c7d2fe; font-size: 10px; font-weight: bold; letter-spacing: 0.2em; margin-top: 10px; text-transform: uppercase;">
                        Functional Neuro Health
                    </div>
                </td>
            </tr>
            
            <!-- Body Content -->
            <tr>
                <td class="content">
                    {{ message_content }}
                </td>
            </tr>
            
            <!-- Signature Area -->
            <tr>
                <td style="padding: 0 40px 40px 40px;">
                    <table width="100%">
                        <tr>
                            <td style="border-top: 1px solid #f1f5f9; padding-top: 20px;">
                                <div style="font-weight: 800; color: #0f172a; font-size: 14px;">Daniele Buatti</div>
                                <div style="color: #94a3b8; font-size: 12px; font-weight: 600;">Integrated Healer & Practitioner</div>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>

        <!-- Footer -->
        <table class="footer" role="presentation">
            <tr>
                <td>
                    <div class="footer-divider"></div>
                    <p>
                        {{ address }}
                    </p>
                    <p>
                        <a href="{{ unsubscribe_url }}">Unsubscribe</a> &nbsp;•&nbsp; 
                        <a href="{{ subscriber_preferences_url }}">Update Preferences</a>
                    </p>
                    <div style="margin-top: 20px; opacity: 0.5;">
                        Sent via Antigravity CRM Marketing Engine
                    </div>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
